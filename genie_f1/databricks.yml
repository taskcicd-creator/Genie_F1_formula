# This is a Declarative Automation Bundle definition for genie_f1.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: genie_f1
  uuid: dddbddf4-6b35-4327-9b33-767b29145865

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405611203658230.10.azuredatabricks.net
    variables:
      catalog: yes
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://adb-7405608037100953.13.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/taskcicd@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/taskcicd@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: yes
      schema: prod
    permissions:
      - user_name: taskcicd@gmail.com
        level: CAN_MANAGE
