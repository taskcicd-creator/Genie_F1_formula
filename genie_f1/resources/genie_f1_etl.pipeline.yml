# The main pipeline for genie_f1

resources:
  pipelines:
    genie_f1_etl:
      name: genie_f1_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/genie_f1_etl"

      libraries:
        - glob:
            include: ../src/genie_f1_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
